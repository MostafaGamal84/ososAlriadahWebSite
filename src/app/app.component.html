<a
  class="skip-link"
  href="#main-content"
  (click)="$event.preventDefault(); mainContent.focus()"
  >{{
    contactService.currentLang === "ar"
      ? "انتقل إلى المحتوى"
      : "Skip to content"
  }}</a
>
@if (!router.url.startsWith('/admin')) { <app-header></app-header> }
<main id="main-content" #mainContent tabindex="-1">
  <router-outlet></router-outlet>
</main>
@if (!router.url.startsWith('/admin')) { <app-footer></app-footer><app-back-to-top></app-back-to-top> }
<app-live-editor></app-live-editor>
